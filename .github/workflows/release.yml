name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Cargo cache
        uses: swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Compute SHA-256 Checksum
        shell: powershell
        run: |
          $Hash = (Get-FileHash -Algorithm SHA256 "target/release/macroforge.exe").Hash.ToLower()
          "$Hash  macroforge.exe" | Out-File -Encoding ascii "target/release/macroforge.exe.sha256"
          Get-Content "target/release/macroforge.exe.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: MacroForge Release ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/macroforge.exe
            target/release/macroforge.exe.sha256
