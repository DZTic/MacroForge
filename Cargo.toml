[package]
name = "macroforge"
version = "1.2.0"
description = "High-performance native macro engine for Windows"
authors = ["DZTic"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5.3"
image = "0.25.10"
lazy_static = "1.5.0"
rayon = "1.10.0"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "windef",
    "wingdi",
    "libloaderapi",
    "timeapi",
    "processthreadsapi"
] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "macro_core_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Profil release avec symboles pour le profilage CPU (samply, docs/profiling.md) :
# le profil release standard strip les symboles, inutilisables par un profileur.
[profile.profiling]
inherits = "release"
debug = true
strip = false
