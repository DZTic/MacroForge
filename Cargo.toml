[package]
name = "macroforge"
version = "0.2.0"
description = "High-performance native macro engine for Windows"
authors = ["DZTic"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5.3"
image = "0.25.10"
lazy_static = "1.5.0"
xcap = "0.9.3"
rayon = "1.10.0"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "windef",
    "wingdi",
    "libloaderapi"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
